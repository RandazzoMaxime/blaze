[package]
name = "blaze-fmt"
description = "rustfmt owned by blaze: rustfmt's formatting over rust-analyzer's syntax trees, with no rustc crates"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
# The versions the pinned nightly's rustfmt is built with (rust-lang/rust's Cargo.lock at
# 12433c307): widths, grapheme breaks and the line diff of `--check` are theirs.
annotate-snippets = "=0.12.16"
diff = "=0.1.13"
unicode-segmentation = "=1.12.0"
unicode-width = "=0.1.14"
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }
itertools.workspace = true
parking_lot = "0.12.5"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror = "2.0.18"
toml.workspace = true
tracing.workspace = true

blaze-manifest.workspace = true
parser.workspace = true
syntax.workspace = true

[lints]
workspace = true
