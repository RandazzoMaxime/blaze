<text x="450.8" y="156" font-size="11" text-anchor="middle" fill="#6b6a68">2 GB</text>
<line x1="587.0" y1="96" x2="587.0" y2="140" stroke="#e4e3df"/>
<text x="587.0" y="156" font-size="11" text-anchor="middle" fill="#6b6a68">5 GB</text>
