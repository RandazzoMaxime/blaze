<svg xmlns="http://www.w3.org/2000/svg" width="760" height="184" viewBox="0 0 760 184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-label="Memory while an edit builds">
<title>Memory while an edit builds</title>
<text x="12" y="22" font-size="15" font-weight="600" fill="#1f1f20">Memory while an edit builds</text>
<text x="12" y="41" font-size="12" fill="#6b6a68">The most every process doing the work held at once. ra-jit's includes the daemon, which keeps the workspace loaded. macOS</text>
<text x="12" y="58" font-size="12" fill="#6b6a68">arm64, MacBook Pro (smoke), ra-jit 84760c3f51, 2026-10-21.</text>
<rect x="12" y="69" width="10" height="10" rx="2" fill="#1f1f20"/>
<text x="28" y="78" font-size="12" fill="#1f1f20">ra-jit: daemon, workers, command</text>
<rect x="242.48" y="69" width="10" height="10" rx="2" fill="#a3a29f"/>
<text x="258.48" y="78" font-size="12" fill="#1f1f20">cargo: cargo, rustc, linker</text>
<line x1="108.5" y1="96" x2="108.5" y2="140" stroke="#e4e3df"/>
<text x="108.5" y="156" font-size="11" text-anchor="middle" fill="#6b6a68">200 MB</text>
