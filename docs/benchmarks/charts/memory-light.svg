<title>Memory while an edit to one function builds</title>
<text x="12" y="22" font-size="15" font-weight="600" fill="#1f1f20">Memory while an edit to one function builds</text>
<text x="12" y="41" font-size="12" fill="#6b6a68">The most every process doing the work held at once: the bar is ra-jit's, with the daemon, which keeps the workspace loaded;</text>
<text x="12" y="58" font-size="12" fill="#6b6a68">the notch is cargo's (cargo, rustc, the linker). macOS arm64: MacBook Pro, ra-jit 84760c3f51, 2026-10-21.</text>
