<text x="16" y="26" font-size="17" class="b">How much faster an edit builds than with cargo</text>
<text x="16" y="45" font-size="13" class="d">A small edit to a real project, then an incremental build: cargo build's time ÷ cargo ra-jit build's, both warm. The bar</text>
<text x="16" y="64" font-size="13" class="d">is the median over the kinds of edit, the thin line runs from the slowest kind to the fastest. Right of the 1× line ra-jit</text>
<text x="16" y="83" font-size="13" class="d">is better, left of it worse; the scale is logarithmic.</text>
