<title>Edit, then build: how many times faster than cargo</title>
<text x="12" y="22" font-size="15" font-weight="600" fill="#1f1f20">Edit, then build: how many times faster than cargo</text>
<text x="12" y="41" font-size="12" fill="#6b6a68">Incremental cargo build against cargo ra-jit build, both warm, on each platform's own machine. The bar is the median over the</text>
<text x="12" y="58" font-size="12" fill="#6b6a68">kinds of edit, the line spans the slowest to the fastest kind. macOS arm64: MacBook Pro, ra-jit 84760c3f51, 2026-10-21. Linux</text>
<text x="12" y="75" font-size="12" fill="#6b6a68">aarch64: AWS c8g.16xlarge, ra-jit 2cf189feb6, 2026-10-22. Linux x86-64: AWS c7a.48xlarge, ra-jit 2cf189feb6, 2026-10-22.</text>
