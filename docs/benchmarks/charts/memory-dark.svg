<title>Memory while an edit to one function builds</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#f0f6fc}.d{fill:#9198a1}.b{font-weight:600}.v{font-variant-numeric:tabular-nums}.g{stroke:#262c36}.r{stroke:#9198a1;stroke-width:1.25}.z{fill:#151b23}.c{fill:#f0f6fc}.o{fill:none;stroke-width:1.25}.p0{fill:#5aa9f5}.w0{stroke:#5aa9f5}.p1{fill:#f0913a}.w1{stroke:#f0913a}.p2{fill:#34c69a}.w2{stroke:#34c69a}</style>
<text x="16" y="26" font-size="17" class="b">Memory while an edit to one function builds</text>
<text x="16" y="45" font-size="13" class="d">The most memory every process doing the work held at once. The bar is ra-jit's: its daemon, which keeps the project</text>
<text x="16" y="64" font-size="13" class="d">loaded between edits, its workers and the command. The tick is plain cargo's: cargo, rustc and the linker. Shorter is</text>
<text x="16" y="83" font-size="13" class="d">less memory.</text>
