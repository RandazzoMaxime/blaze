# bun (oven-sh/bun 1.4.3, its Rust port: 1.25M lines in 105 crates) built through ra-jit on the
# dedicated benchmark machine, nightly: the edits of harness/bench.py and the runtime of
# harness/runbench.py, into the README's bun section (docs/research/bun.md says what it is).
# Too slow for every push: bun's own build of its C and C++ (once per revision, kept in
# BENCH_HOME), cargo's cold build and ra-jit's whole-program LLVM build each take minutes.
# It shares bench-readme's concurrency group, so the two never run at once on the one machine.
name: bench-bun
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Write the README even when every number is within noise"
        type: boolean
        default: false

concurrency:
  group: bench-readme
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  bench:
    name: bench (bun, Linux x86-64)
    if: vars.BENCH_RUNNER == 'true'
    runs-on: [self-hosted, linux, x64, bench-x86]
    timeout-minutes: 360
    env:
      # Kept between runs, outside the checkout, as bench-readme's: ra-jit builds
      # incrementally, bun is cloned once and its C and C++ built once per revision.
      BENCH_HOME: ${{ github.workspace }}/../bench-state
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - name: Build ra-jit (as released, and with the llvm feature)
        run: |
          mkdir -p "$BENCH_HOME"
          CARGO_TARGET_DIR="$BENCH_HOME/target" nix develop .#bench -c cargo build -p ra-jit --release
          CARGO_TARGET_DIR="$BENCH_HOME/target-llvm" nix develop .#bench -c cargo build -p ra-jit --release --features llvm
      # Edits: bun's own build of its C and C++ goes to RA_JIT_PROJECTS/bun-native once per
      # revision (bunprep.py); the measured trees are copies of it.
      - name: Bench
        id: bench
        run: |
          export RA_JIT_BIN="$BENCH_HOME/target/release/ra-jit" RA_JIT_PROJECTS="$BENCH_HOME/projects"
          rm -rf "$BENCH_HOME/work-bun" "$BENCH_HOME/reference-bun"
          nix develop .#bench-bun -c env -u CARGO_INCREMENTAL -u RUSTC_WRAPPER python3 harness/bench.py bun \
            --runs 3 --work "$BENCH_HOME/work-bun" --reference "$BENCH_HOME/reference-bun" --out "$RUNNER_TEMP/bench-bun.json" \
            || { status=$?; [ "$status" = 3 ] || exit "$status"; echo "wrong=true" >> "$GITHUB_OUTPUT"; }
      - name: Runtime bench
        continue-on-error: true
        run: |
          export RA_JIT_BIN="$BENCH_HOME/target-llvm/release/ra-jit" APPS_DIR="$BENCH_HOME/apps"
          nix develop .#bench-bun -c env -u CARGO_INCREMENTAL -u RUSTC_WRAPPER python3 harness/bench.py --runtime bun \
            --runs 5 --out "$RUNNER_TEMP/runtime-bun.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-bun
          path: |
            ${{ runner.temp }}/bench-bun.json
            ${{ runner.temp }}/runtime-bun.json
      - name: README
        continue-on-error: true
        run: |
          for result in bench-bun runtime-bun; do
            [ -f "$RUNNER_TEMP/$result.json" ] || continue
            nix develop .#bench -c python3 harness/benchreport.py "$RUNNER_TEMP/$result.json" --name bun \
              ${{ inputs.force && '--force' || '' }} || true
          done
      - name: Commit to main
        run: |
          git add README.md docs/benchmarks/
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "bench: bun's numbers for ${GITHUB_SHA::10} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; echo "::error::the bench commit does not apply to main"; exit 1; }
            git push -q origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
      - name: Fail on a wrong result
        if: steps.bench.outputs.wrong == 'true'
        run: |
          echo "::error::under ra-jit bun said something else than under cargo: see the Bench step"
          exit 1
