name: diag perf static
on:
  push:
    branches: [diag-perf-static-1021]
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RA_JIT_BACKEND: llvm
      RA_JIT_OPT: 2
      RA_JIT_EMIT: fast
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          save-if: false
      - run: cargo build -p ra-jit --release --features llvm --locked
      - run: |
          sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y linux-tools-generic
          perf --version || sudo ln -sf "$(ls /usr/lib/linux-tools/*/perf | tail -n 1)" /usr/local/bin/perf
          sudo sysctl kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
      - run: RA_JIT_BIN="$PWD/target/release/ra-jit" python3 harness/diag_perf_static.py "$RUNNER_TEMP/diag"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag
          path: ${{ runner.temp }}/diag
