# A failed nightly run, as issues: one per job that failed, titled "Nightly <workflow>: <job>",
# with a link to the run and the harnesses that failed. While a job's issue is open, each later
# failed night is a comment on it instead of another issue (.github/scripts/nightly_issues.py).
# The job that uses it needs `issues: write` and `actions: read` (the failed jobs' logs).
name: nightly issue
description: Open or add to the issue of each job that failed in a nightly run
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/nightly_issues.py
